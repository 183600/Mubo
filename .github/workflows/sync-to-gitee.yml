name: Sync to Gitee

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Auto-push PRs from cto.new'
      - 'CI'
      - 'Continuous Loop'
    types: [completed]
concurrency:
  # 连发触发（push / workflow_run）时只保留最新一次同步，排队中的旧任务直接被替换，
  # 不再串行堆一串重复的镜像 job（镜像推送幂等，取消旧的没有副作用）。
  group: sync-to-gitee
  cancel-in-progress: true

jobs:
  sync-to-gitee:
    name: Mirror push to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mirror push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          GH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN secret，跳过 Gitee 同步（在仓库 secrets 配置后自动恢复）。"
            exit 0
          fi
          GITEE_URL="https://qwe12345678:${GITEE_TOKEN}@gitee.com/qwe12345678/${REPO_NAME}.git"
          if ! git ls-remote "$GITEE_URL" >/dev/null 2>&1; then
            echo "Gitee 仓库不可达（gitee.com/qwe12345678/${REPO_NAME} 可能尚未创建），跳过本次同步。"
            exit 0
          fi
          GH_REFS=$(git ls-remote "$GH_URL" | grep -E 'refs/(heads|tags)/' | sort || true)
          GITEE_REFS=$(git ls-remote "$GITEE_URL" | grep -E 'refs/(heads|tags)/' | sort || true)
          if [ -n "$GH_REFS" ] && [ "$GH_REFS" = "$GITEE_REFS" ]; then
            echo "Already in sync with Gitee - nothing to push."
            exit 0
          fi
          git clone --mirror "$GH_URL" repo.git
          cd repo.git
          git push --prune --force "$GITEE_URL" 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
          echo "Mirror push to Gitee completed."
